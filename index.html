<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>KaramanbaTV</title>
<link rel="stylesheet" href="css/style.css">
<script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
<object id="avplayer" type="application/avplayer"></object>
<video id="vid" playsinline></video>

<div id="home">
  <aside id="side">
    <div class="brand"><span class="bk">Karamanba</span><span class="bt">TV</span></div>
    <div id="sideList"></div>
  </aside>
  <main id="main">
    <header class="top">
      <h1 id="title">Tümü</h1>
      <span id="count"></span>
      <span class="sp"></span>
      <span id="clock"></span>
    </header>
    <div id="gwrap"><div id="grid"></div><div id="empty" hidden></div></div>
    <footer class="keys">
      <span><b>OK</b>İzle</span><span><b class="y">Sarı</b>Favori</span><span><b class="b">Mavi</b>Ara</span><span><b>Geri</b>Menü / Çık</span>
    </footer>
  </main>
</div>

<div id="player" hidden>
  <div id="spin"><i></i><span id="spinTxt">Yükleniyor</span></div>
  <div id="num" hidden></div>
  <div id="info" hidden>
    <div class="ilogo" id="iLogo"></div>
    <div class="itxt">
      <div class="irow"><span id="iNo"></span><span id="iName"></span><span id="iFav" hidden>Favori</span></div>
      <div id="iGrp"></div>
    </div>
    <div class="ihint"><span><b>▲▼</b>Kanal</span><span><b class="y">Sarı</b>Favori</span><span><b>Geri</b>Liste</span></div>
  </div>
  <div id="err" hidden><div class="et">Yayın açılamadı</div><div class="es" id="errTxt"></div><div class="eh">Yeniden denemek için OK, listeye dönmek için Geri</div></div>
</div>

<div id="setup" hidden>
  <div class="sbox">
    <div class="brand big"><span class="bk">Karamanba</span><span class="bt">TV</span></div>
    <h2 id="setupH">Liste adresini girin</h2>
    <p>M3U veya M3U8 liste bağlantınızı yazın. Liste cihazda saklanır, sonraki açılışta hemen görünür.</p>
    <input id="urlIn" type="url" placeholder="http://sunucu.com/liste.m3u" autocomplete="off" spellcheck="false">
    <div class="srow">
      <button id="btnLoad" type="button">Listeyi yükle</button>
      <button id="btnClear" type="button">Kayıtlı listeyi sil</button>
      <button id="btnClose" type="button">Kapat</button>
    </div>
    <div id="setupMsg"></div>
  </div>
</div>

<div id="toast" hidden></div>
<script src="js/m3u.js"></script>
<script src="js/app.js"></script>
</body>
</html>
